# hyperbuzz-owned build config (upstream has no file here — additive, so it
# never conflicts when merging block/buzz mainline). Keeps our only behavioral
# divergence from upstream — the default relay + auto-connect — OUT of the
# tracked Rust source and in build-time env instead. Reverting the fork to
# stock upstream is just deleting this file.
#
# `option_env!` in desktop/src-tauri/src/{relay.rs,commands/identity.rs} reads
# these at compile time; a runtime BUZZ_RELAY_URL still overrides the URL.
[env]
BUZZ_DESKTOP_BUILD_RELAY_URL = "wss://buzz.menger.sh"
BUZZ_DESKTOP_BUILD_AUTO_CONNECT_DEFAULT_RELAY = "1"
# Baked invite code, redeemed on first auto-connect so a generated identity is
# admitted to a membership-gated relay. Empty today because buzz.menger.sh runs
# open (BUZZ_REQUIRE_RELAY_MEMBERSHIP=false). To switch to invite-gated: mint a
# code (≤30-day TTL), paste it here, and rebuild.
BUZZ_DESKTOP_BUILD_INVITE_CODE = ""
